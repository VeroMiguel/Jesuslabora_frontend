# nginx.conf - CORREGIDO
server {
    listen 4200;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ✅ Permitir archivos estáticos directamente
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|json|svg|woff|woff2|ttf|otf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ✅ Manejar service-worker.js específicamente (NO usar try_files)
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # ✅ Manejar manifest.json
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ✅ Manejar firebase-messaging-sw.js (si existe)
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # ✅ Para todas las demás rutas, servir index.html (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ✅ API proxy (CORREGIDO)
    location /api {
        proxy_pass https://jesuslaboraback-production.up.railway.app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}