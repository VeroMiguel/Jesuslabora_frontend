<!-- orden-form.component.html - VERSIÓN LIMPIA -->
<div class="form-container">
  <div class="header">
    <h1>{{ esEdicion ? 'Editar' : 'Nueva' }} Orden</h1>
    <button class="btn-secondary" routerLink="/ordenes">
      <i class="fas fa-arrow-left"></i> Volver
    </button>
  </div>

  <form [formGroup]="ordenForm" (ngSubmit)="onSubmit()" class="form">
    <!-- Doctor -->
    <div class="form-group">
      <label>Doctor *</label>
      <app-searchable-select
        *ngIf="doctores.length > 0"
        formControlName="doctor_id"
        [opciones]="doctores"
        placeholder="Buscar doctor..."
        [mostrarIcono]="true"
        [mostrarDetalle]="true"
      ></app-searchable-select>
    </div>

    <!-- Servicios (componente compacto) -->
    <div class="form-group">
      <label>Servicios *</label>
      <app-multi-servicio-selector
        #multiServicioSelector
        [serviciosDisponibles]="servicios"
        [detallesIniciales]="detallesIniciales"
        [clienteGlobal]="clienteGlobal"
        (detallesChange)="onDetallesChange($event)"
        (totalChange)="onTotalChange($event)"
        (clienteGlobalChange)="onClienteGlobalChange($event)"
        (tipoClienteChange)="onTipoClienteChange($event)"
      ></app-multi-servicio-selector>
    </div>

    <!-- Pago Inicial y Prioridad -->
    <div class="form-row">
      <div class="form-group">
        <label>Pago Inicial (S/)</label>
        <input type="number" formControlName="pago_inicial" class="form-control" step="0.01" min="0">
      </div>

      <div class="form-group">
        <label>Prioridad</label>
        <select formControlName="prioridad" class="form-control">
          <option value="normal">Normal</option>
          <option value="urgente">Urgente</option>
          <option value="emergencia">Emergencia</option>
        </select>
      </div>
    </div>

    <!-- ✅ ELIMINADO: Cliente, Detalle del Caso, Imagen de Referencia -->

    <div class="form-actions">
      <button type="button" class="btn-secondary" routerLink="/ordenes">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="ordenForm.invalid || subiendoImagen">
        <i class="fas" [ngClass]="{'fa-spinner fa-spin': subiendoImagen, 'fa-save': !subiendoImagen}"></i>
        {{ subiendoImagen ? 'Guardando...' : (esEdicion ? 'Actualizar' : 'Guardar') }}
      </button>
    </div>
  </form>
</div>
