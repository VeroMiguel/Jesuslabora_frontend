<!-- multi-servicio-selector.component.html - VERSIÓN ULTRA COMPACTA -->
<div class="multi-servicio-container">
  <!-- Encabezado con selector de tipo de cliente -->
  <div class="tipo-cliente-selector">
    <label class="switch-label">
      <input type="radio" [(ngModel)]="tipoCliente" value="unico" (change)="onTipoClienteChange()">
      <span>Servicios para un solo paciente</span>
    </label>
    <label class="switch-label">
      <input type="radio" [(ngModel)]="tipoCliente" value="multiple" (change)="onTipoClienteChange()">
      <span>Paciente diferente por servicio</span>
    </label>
  </div>

  <!-- Campos comunes del cliente (cuando es único) -->
  <div class="cliente-unico" *ngIf="tipoCliente === 'unico'">
    <div class="cliente-unico-fields">
      <input 
        type="text" 
        [(ngModel)]="clienteUnico.nombre"
        placeholder="Nombre del cliente"
        class="cliente-input"
      >
      <textarea 
        [(ngModel)]="clienteUnico.detalle"
        placeholder="Detalle del caso (opcional)"
        rows="2"
        class="detalle-input"
      ></textarea>
    </div>
  </div>

  <!-- Lista de servicios (compacta) -->
  <div class="servicios-list">
    <div *ngFor="let detalle of detalles; let i = index" class="servicio-item">
      <!-- Fila principal del servicio (siempre visible) -->
      <div class="servicio-fila-principal" (click)="toggleExpandir(i)">
        <div class="servicio-info">
          <span class="servicio-numero">{{ i + 1 }}</span>
          <span class="servicio-nombre" [class.seleccionado]="detalle.servicio_id">
            {{ detalle.servicio_nombre || 'Seleccionar servicio' }}
          </span>
          <span class="servicio-precio" *ngIf="detalle.precio_unitario > 0">
            {{ detalle.precio_unitario | moneda }}
          </span>
          <i class="fas fa-chevron-down expand-icon" [class.rotated]="expandidos[i]"></i>
        </div>
        <button type="button" class="btn-remove-servicio" (click)="removerDetalle(i, $event)" *ngIf="detalles.length > 1">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <!-- Detalles expandidos (solo cuando se hace clic) -->
      <div class="servicio-detalles" *ngIf="expandidos[i]">
        <!-- Selector de servicio -->
<!-- multi-servicio-selector.component.html - MODIFICAR EL DROPDOWN -->

<div class="servicio-selector-wrapper">
  <input 
    type="text"
    [value]="detalle.servicio_nombre || ''"
    (focus)="onServicioFocus(i)"
    (input)="filtrarServicios(i, $any($event.target).value)"
    (click)="$event.stopPropagation()"
    placeholder="Buscar servicio..."
    class="servicio-busqueda"
    autocomplete="off"
  >
  
  <div class="dropdown-list" *ngIf="indicesActivos[i] && getServiciosFiltrados(i).length > 0">
    <div *ngFor="let servicio of getServiciosFiltrados(i)" 
         class="dropdown-item" 
         (click)="seleccionarServicio(i, servicio); $event.stopPropagation()">
      <span>{{ servicio.nombre }}</span>
      <span class="precio">{{ servicio.precio_referencial | moneda }}</span>
    </div>
  </div>
  
  <div class="dropdown-empty-message" *ngIf="indicesActivos[i] && getServiciosFiltrados(i).length === 0 && serviciosDisponibles.length > 0">
    No se encontraron servicios
  </div>
  
  <div class="dropdown-loading" *ngIf="indicesActivos[i] && serviciosDisponibles.length === 0">
    Cargando servicios...
  </div>
</div>
        <!-- Precio unitario -->
        <div class="campo-precio">
          <label>Precio</label>
          <input type="number" [(ngModel)]="detalle.precio_unitario" (change)="calcularTotal()" step="0.01" class="precio-input">
        </div>

        <!-- Fecha y hora límite -->
        <div class="fecha-hora-row">
          <input type="date" [(ngModel)]="detalle.fecha_limite" placeholder="Fecha límite" class="fecha-input">
          <input type="time" [(ngModel)]="detalle.hora_limite" placeholder="Hora" class="hora-input" step="60">
        </div>

 <!-- ✅ Pago Inicial por Servicio (solo cuando tipoCliente === 'multiple') -->
  <div class="pago-inicial-servicio" *ngIf="tipoCliente === 'multiple'">
    <label>Pago Inicial (S/)</label>
    <input type="number" [(ngModel)]="detalle.pago_inicial" 
           (change)="calcularTotal()" 
           step="0.01" min="0" 
           class="pago-inicial-input"
           placeholder="0.00">
  </div>

<!-- Cliente por servicio (solo si tipoCliente === 'multiple') -->
<div class="cliente-servicio" *ngIf="tipoCliente === 'multiple'">
  <div class="cliente-servicio-row">
    <input type="text" [(ngModel)]="detalle.cliente_nombre" placeholder="Nombre del cliente" class="cliente-input-servicio">
  </div>
  <textarea [(ngModel)]="detalle.detalle_cliente" placeholder="Detalle del caso (opcional)" rows="1" class="detalle-input-servicio"></textarea>
</div>

       <!-- multi-servicio-selector.component.html - Modificar sección de imagen preview -->
<div class="imagen-servicio">
  <div class="imagen-upload" *ngIf="!detalle.imagen_preview">
    <button type="button" class="btn-subir-imagen" (click)="abrirSelectorImagen(i)">
      <i class="fas fa-image"></i> Subir imagen
    </button>
  </div>
  
  <!-- ✅ Usar SweetAlert2 al hacer clic en la imagen (misma lógica que en detalle) -->
  <div class="imagen-preview" *ngIf="detalle.imagen_preview">
    <img 
      [src]="detalle.imagen_preview | imagen" 
      (click)="verImagenServicio(detalle.imagen_url || detalle.imagen_preview)"
      class="preview-thumbnail"
      title="Ver imagen de referencia"
    >
    <button type="button" class="btn-remove-img" (click)="removerImagen(i); $event.stopPropagation()">×</button>
  </div>
  <span class="imagen-hint" *ngIf="detalle.imagen_nombre">{{ detalle.imagen_nombre }}</span>
</div>
      </div>
    </div>
  </div>

  <!-- Botón agregar servicio -->
  <button type="button" class="btn-agregar" (click)="agregarDetalle()">
    <i class="fas fa-plus"></i> Agregar otro servicio
  </button>

  <!-- Total -->
  <div class="total-general">
    <span>TOTAL:</span>
    <strong>{{ totalGeneral | moneda }}</strong>
  </div>
</div>
