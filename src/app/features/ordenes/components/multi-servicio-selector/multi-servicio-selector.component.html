<!-- multi-servicio-selector.component.html - VERSIÓN CORREGIDA -->
<div class="multi-servicio-container">
  <div class="detalles-list">
    <div *ngFor="let detalle of detalles; let i = index" class="detalle-card">
      <div class="detalle-header">
        <span class="detalle-numero">Servicio {{ i + 1 }}</span>
        <button type="button" class="btn-remove" (click)="removerDetalle(i)" *ngIf="detalles.length > 1">
          <i class="fas fa-trash-alt"></i>
        </button>
      </div>
      
      <div class="detalle-body">
        <!-- Selector de servicio -->
        <div class="form-group servicio-selector">
          <label>SERVICIO *</label>
          <div class="searchable-select">
            <input 
              type="text"
              [value]="detalle.servicio_nombre || ''"
              (focus)="toggleDropdown(i)"
              (input)="filtrarServicios(i, $any($event.target).value)"
              placeholder="Buscar servicio..."
              class="form-control"
              autocomplete="off"
            >
            <!-- ✅ LÍNEA CORREGIDA: verificar que el array existe antes de acceder a length -->
            <div class="dropdown-list" *ngIf="indicesActivos[i] && serviciosFiltradosPorIndice[i] && serviciosFiltradosPorIndice[i].length > 0">
              <div 
                *ngFor="let servicio of serviciosFiltradosPorIndice[i]"
                class="dropdown-item"
                (click)="seleccionarServicio(i, servicio)"
              >
                <span class="servicio-nombre">{{ servicio.nombre }}</span>
                <span class="servicio-precio" *ngIf="servicio.precio_referencial">
                  S/ {{ servicio.precio_referencial | number:'1.2-2' }}
                </span>
              </div>
            </div>
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>CANTIDAD</label>
            <input 
              type="number" 
              [(ngModel)]="detalle.cantidad" 
              (change)="calcularSubtotal(detalle)"
              min="1" 
              step="1"
              class="form-control"
            >
          </div>
          
          <div class="form-group">
            <label>PRECIO UNITARIO (S/)</label>
            <input 
              type="number" 
              [(ngModel)]="detalle.precio_unitario" 
              (change)="calcularSubtotal(detalle)"
              min="0" 
              step="0.01"
              class="form-control"
            >
          </div>
          
          <div class="form-group subtotal">
            <label>SUBTOTAL</label>
            <div class="subtotal-value">{{ detalle.subtotal | moneda }}</div>
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>FECHA LÍMITE (OPCIONAL)</label>
            <input 
              type="date" 
              [(ngModel)]="detalle.fecha_limite"
              class="form-control"
            >
          </div>
          
          <div class="form-group">
            <label>HORA LÍMITE (OPCIONAL)</label>
            <input 
              type="time" 
              [(ngModel)]="detalle.hora_limite"
              class="form-control"
              step="60"
            >
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <button type="button" class="btn-agregar-servicio" (click)="agregarDetalle()">
    <i class="fas fa-plus-circle"></i> Agregar otro servicio
  </button>
  
  <div class="total-general">
    <span class="total-label">TOTAL DE LA ORDEN:</span>
    <span class="total-value">{{ totalGeneral | moneda }}</span>
  </div>
</div>
